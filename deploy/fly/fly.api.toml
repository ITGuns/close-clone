# Switchboard API on Fly — PRIVATE app (no public IP). Reached only over Fly's
# private network (flycast) by the switchboard-web nginx. Reuses the pilot's
# managed backing services: Neon (DATABASE_URL) + Upstash (REDIS_URL) + Google
# as the OIDC IdP. Migrations run on boot via the image entrypoint (idempotent —
# Neon already carries the schema).
#
# Deploy from the REPO ROOT:  fly deploy -c deploy/fly/fly.api.toml
app = "switchboard-api"
primary_region = "iad" # us-east — same coast as Neon us-east-1 + Upstash us-east-1

[build]
  dockerfile = "apps/api/Dockerfile"

# Non-secret config. Secrets (DATABASE_URL, REDIS_URL, OIDC_CLIENT_ID/SECRET,
# SESSION_SECRET, LIST_UNSUBSCRIBE_SECRET, AUTH_ADMIN_EMAILS, WEB_ORIGIN) are set
# with `fly secrets set` — see deploy/fly/RUNBOOK.md.
[env]
  NODE_ENV = "production"
  APP_ROLE = "server"
  PORT = "3000"
  MOCK_MODE = "0"
  OIDC_ISSUER = "https://accounts.google.com"
  AUTH_ALLOWED_DOMAIN = "gmail.com"

# internal_port + a private IPv6 (allocate with `fly ips allocate-v6 --private`)
# make this app reachable at switchboard-api.flycast:3000 and nowhere public.
[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1 # keep warm: holds the PG/Redis pools + OIDC session store

# No app-level HTTP check here on purpose: /healthz does a deep PG+Redis probe and
# can lag on the free Upstash tier — a strict check would false-negative and cycle
# the machine. Fly's process liveness keeps it up. Add a check once Redis latency
# is confirmed healthy from iad.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
