# Switchboard web front door — FLY.IO variant of deploy/web/nginx.conf.
# Same server as the compose nginx, except the api upstream is reached over Fly's
# PRIVATE network: the `switchboard-api` app, addressed via flycast (a stable
# private IPv6 that Fly's proxy load-balances to the api machines). This lets the
# api stay private (no public IP) while the web stays same-origin — so the SPA's
# relative /api + /ws calls and the OIDC session cookie never leave one origin.
#
# The only diffs from deploy/web/nginx.conf: the resolver (Fly internal DNS,
# IPv6) and every `$api_upstream` value (api:3000 → switchboard-api.flycast:3000).

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff
    font/woff2;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Fly internal DNS (IPv6). flycast/.internal names resolve here; ipv6 must be ON.
  resolver [fdaa::3]:53 valid=10s;

  location /api/ {
    client_max_body_size 65m;
    set $api_upstream switchboard-api.flycast:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /wh/ {
    client_max_body_size 1m;
    set $api_upstream switchboard-api.flycast:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    set $api_upstream switchboard-api.flycast:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  location = /healthz {
    set $api_upstream switchboard-api.flycast:3000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
