name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MOCK_MODE: '1'
      NODE_ENV: test
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-insecure-secret
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Generate golden fixtures (smoke)
        run: pnpm fixtures:generate --golden

  perf:
    name: perf gate (100k latency, authoritative on real PG)
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MOCK_MODE: '1'
      NODE_ENV: test
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf

  # ---------------------------------------------------------------------------
  # Container smoke — the layer D-061 proved was missing. Every other suite in
  # this repo mocks the one beneath it: Playwright drives MSW and never touches
  # the API, the api tests bypass the auth layer, the dev boot mounts no session
  # guard, and NOTHING built either Docker image. ~4,000 green tests coexisted
  # with a deployed app whose every write returned 403.
  #
  # This job is the only place the real artifacts are exercised:
  #   1. both Dockerfiles are BUILT (apps/api/Dockerfile, apps/web/Dockerfile) —
  #      a base-image bump or a Dockerfile regression now has a signal;
  #   2. the composed stack from deploy/docker-compose.yml is brought UP and
  #      gated on its own healthchecks (`--wait`);
  #   3. e2e/container-smoke.mjs drives it in a real chromium against the real
  #      nginx → Fastify → Postgres path.
  #
  # `needs: build-test` on purpose: this is the slowest job in CI (two full
  # multi-stage image builds plus a stack boot), so lint/typecheck/unit failures
  # must surface first rather than queueing behind it. It is NOT gated on `perf`
  # (unrelated) and it does NOT gate the Pages publish (that ships the static
  # mock-mode bundle, which this stack does not contain).
  #
  # NOTE (reported, not fixed here — the Dockerfiles are outside this change's
  # allowlist): the runner steps below use Node 24 to match every other job and
  # the repo's `engines: >=24`, but BOTH Dockerfiles pin `node:22-bookworm-slim`
  # and there is no .nvmrc. The image therefore runs the api on a different major
  # than anything CI type-checks or tests it on.
  #
  # deploy/.env is gitignored, so it is synthesized here. Compose takes `deploy/`
  # as the project directory, so that file is both the `${VAR}` interpolation
  # source and what the api service's `env_file: .env` resolves to — a repo-root
  # .env is never read by this stack.
  # ---------------------------------------------------------------------------
  container-smoke:
    name: container smoke · both images · composed stack
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Docker / Compose versions
        run: |
          docker version
          docker compose version

      # Three values are required for a mock-mode bring-up (deploy/README.md):
      # POSTGRES_PASSWORD, SESSION_SECRET, LIST_UNSUBSCRIBE_SECRET. The api
      # refuses to boot in production on a placeholder, an empty value, anything
      # under 32 chars, or on the two secrets being equal — so they are generated
      # per run and never echoed.
      - name: Synthesize deploy/.env
        working-directory: deploy
        run: |
          set -eu
          umask 077
          {
            echo "# Generated by .github/workflows/ci.yml — CI only, never committed."
            echo "POSTGRES_USER=switchboard"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=switchboard"
            echo "NODE_ENV=production"
            echo "MOCK_MODE=1"
            echo "PORT=3000"
            echo "WEB_HTTP_PORT=8080"
            echo "WEB_ORIGIN=http://localhost:8080"
            echo "LOG_LEVEL=info"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "LIST_UNSUBSCRIBE_SECRET=$(openssl rand -hex 32)"
          } > .env
          echo "wrote deploy/.env with $(wc -l < .env) lines (values withheld)"

      # Catches a missing required variable and any schema error before the
      # (expensive) image builds start.
      - name: Validate the compose file
        working-directory: deploy
        run: docker compose config --quiet

      # Both Dockerfiles. `worker` reuses the api image, so api + web covers
      # every image this repo builds.
      - name: Build the api and web images
        working-directory: deploy
        run: docker compose build --progress plain api web

      # `--wait` blocks until every started service reports healthy and fails the
      # step if one goes unhealthy or exits — postgres, redis, api and web all
      # declare healthchecks (api's start_period is 40s, hence the generous
      # timeout).
      - name: Bring the stack up
        working-directory: deploy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Stack status
        working-directory: deploy
        run: docker compose ps

      # e2e/ is deliberately outside the pnpm workspace (its browser deps stay
      # out of the application graph), so it installs standalone — same as
      # .github/workflows/e2e.yml.
      - name: Install E2E deps (standalone)
        run: pnpm --dir e2e install --ignore-workspace --frozen-lockfile

      - name: Install Playwright chromium + OS deps
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      # The gate. No continue-on-error: container-smoke.mjs exits non-zero on any
      # failed check, and that fails this job.
      - name: Container smoke (real browser, real write, reload)
        working-directory: e2e
        env:
          SMOKE_BASE_URL: http://localhost:8080
        run: node container-smoke.mjs

      # A red run that says only "smoke failed" wastes an afternoon. Dump enough
      # to diagnose from the log alone.
      - name: Diagnostics — compose state and logs
        if: ${{ failure() }}
        working-directory: deploy
        run: |
          # Best-effort: GitHub runs `bash -e`, and a `logs` call for a service
          # that never got created would otherwise abort the remaining groups —
          # exactly the ones you need when the stack failed to come up.
          set +e
          echo "::group::docker compose ps"
          docker compose ps --all
          echo "::endgroup::"
          echo "::group::api logs"
          docker compose logs --no-color --tail=400 api
          echo "::endgroup::"
          echo "::group::web logs"
          docker compose logs --no-color --tail=200 web
          echo "::endgroup::"
          echo "::group::postgres logs"
          docker compose logs --no-color --tail=200 postgres
          echo "::endgroup::"
          echo "::group::redis logs"
          docker compose logs --no-color --tail=100 redis
          echo "::endgroup::"

      - name: Upload smoke artifacts (screenshot + DOM)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-artifacts
          path: e2e/test-results/container-smoke/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear the stack down
        if: ${{ always() }}
        working-directory: deploy
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # GitHub Pages demo publish. Gated: `needs: build-test` means a red typecheck,
  # lint, format or test run blocks the publish instead of shipping it to the
  # demo URL (previously this lived in a standalone pages.yml that fired on every
  # push to main with no gate at all). Not gated on `perf` on purpose: that job
  # measures API latency against real Postgres and has no bearing on the static
  # mock-mode web bundle.
  # ---------------------------------------------------------------------------
  pages-build:
    name: build Pages demo
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build demo (mock mode, repo subpath)
        env:
          VITE_BASE: /close-clone/
        run: pnpm --filter @switchboard/web build
      - name: SPA fallback for deep links
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  pages-deploy:
    name: deploy Pages demo
    needs: pages-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
